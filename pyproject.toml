[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "frisco-agent"
version = "0.1.0"
description = "Recipe ingredients to a Frisco shopping basket"
requires-python = ">=3.13,<3.14"
dependencies = [
  "langchain[mcp]>=1.4,<2",
  "langchain-openai>=1,<2",
  "langgraph>=1,<2",
  "langgraph-sdk",
  "langsmith",
  "streamlit",
  "pydantic>=2,<3",
  "python-dotenv",
]

[project.optional-dependencies]
dev = ["langgraph-cli[inmem]", "pytest"]

[tool.setuptools.packages.find]
where = ["src"]
